<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #ffdde1, #ee9ca7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="bg-white p-10 rounded-2xl shadow-2xl max-w-md w-full text-center" data-aos="flip-up">
        <h1 class="text-2xl font-bold text-green-700 mb-4">✅ Prediction Successful</h1>
        <p class="text-xl text-gray-800 mb-2"><strong>Predicted Blood Group:</strong> <span class="text-red-600">{{ blood_type }}</span></p>
        <p class="text-lg text-gray-700"><strong>Entered Temperature:</strong> {{ temperature }} °C</p>
        <a href="/" class="mt-6 inline-block bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700 transition">
            Predict Another
        </a>
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
