<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Group Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container" data-aos="zoom-in">
        <h1 class="text-3xl font-bold text-center text-red-700 mb-6">Blood Group Detection</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data" class="space-y-4">
            <label class="block">
                <span class="text-gray-700 font-medium">Upload Infrared Image:</span>
                <input type="file" name="image" class="block w-full mt-1 border rounded-lg p-2 border-red-400" required>
            </label>
            <label class="block">
                <span class="text-gray-700 font-medium">Enter Temperature (°C):</span>
                <input type="number" name="temperature" step="0.1" class="block w-full mt-1 border rounded-lg p-2 border-red-400" required>
            </label>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition-all">
                Predict
            </button>
        </form>
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
